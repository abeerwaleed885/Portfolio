                    >
                      <svg className="w-4 h-4 text-[#0A66C2]" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.59 1.59 0 1 0 0-3.18 1.59 1.59 0 0 0 0 3.18m1.4 9.74v-8.37H5.06v8.37h2.8z" />
                      </svg>
                      <span>LinkedIn</span>
                      <span className="text-zinc-400 font-normal">/in/abeer-awad</span>
                    </a>

                    <a
                      href={contact.socialLinks.github.url}
                      target="_blank"
                      rel="noreferrer"
                      className="inline-flex items-center gap-2.5 px-4 py-2 rounded-xl border border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-zinc-800 text-xs font-semibold transition-colors"
                    >
                      <svg className="w-4 h-4 text-zinc-900" fill="currentColor" viewBox="0 0 24 24">
                        <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
                      </svg>
                      <span>GitHub</span>
                      <span className="text-zinc-400 font-normal">/abeerwaleed</span>
                    </a>
                  </div>
                </div>
              </div>

              <div className="lg:col-span-6 p-8 rounded-2xl bg-white border border-zinc-200/90 shadow-2xs">
                <h3 className="text-lg font-bold text-zinc-950 mb-1">
                  {contact.form.title}
                </h3>
                <p className="text-xs text-zinc-500 mb-6">
                  {contact.form.note}
                </p>

                <form onSubmit={handleFormSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-mono text-zinc-600 mb-1">
                      {lang === 'en' ? 'NAME' : 'الاسم'}
                    </label>
                    <input
                      type="text"
                      required
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                      placeholder={contact.form.namePlaceholder}
                      className="w-full px-4 py-2.5 rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-900 text-sm transition-colors"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono text-zinc-600 mb-1">
                      {lang === 'en' ? 'YOUR EMAIL' : 'البريد الإلكتروني'}
                    </label>
                    <input
                      type="email"
                      required
                      value={formData.email}
                      onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                      placeholder={contact.form.emailPlaceholder}
                      className="w-full px-4 py-2.5 rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-900 text-sm transition-colors"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-mono text-zinc-600 mb-1">
                      {lang === 'en' ? 'MESSAGE' : 'الرسالة'}
                    </label>
                    <textarea
                      rows={4}
                      required
                      value={formData.message}
                      onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                      placeholder={contact.form.messagePlaceholder}
                      className="w-full px-4 py-2.5 rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-900 text-sm transition-colors resize-none"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-zinc-950 text-white font-medium text-sm hover:bg-zinc-800 transition-all shadow-xs"
                  >
                    {contact.form.submitBtn}
                  </button>
                </form>
              </div>
            </div>
          </div>

          <Toast
            message={contact.copiedBtn}
            isVisible={toastVisible}
            onClose={() => setToastVisible(false)}
          />
        </section>
      );
    };

    const Footer = () => {
      const { t } = useContext(LangContext);
      const { footer } = t;

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <footer className="py-12 bg-white border-t border-zinc-100 text-zinc-600 text-xs">
          <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
            <div className="space-y-1 text-center md:text-start">
              <p className="font-semibold text-zinc-900">{footer.copyright}</p>
              <p className="text-zinc-500 font-mono text-[11px]">{footer.builtWith}</p>
            </div>

            <div className="flex items-center gap-6">
              <span className="text-zinc-400 hidden sm:inline">{footer.tagline}</span>
              <button
                onClick={scrollToTop}
                className="px-3 py-1.5 rounded-lg border border-zinc-200 bg-zinc-50 hover:bg-zinc-100 text-zinc-700 font-mono transition-colors"
              >
                {footer.backToTop}
              </button>
            </div>
          </div>
        </footer>
      );
    };

    // Root App Component
    function App() {
      const [lang, setLang] = useState(() => {
        try {
          return localStorage.getItem('abeer_portfolio_lang') === 'ar' ? 'ar' : 'en';
        } catch(e) {
          return 'en';
        }
      });

      const isRTL = lang === 'ar';
      const t = portfolioContent[lang] || portfolioContent.en;

      const toggleLang = () => {
        const nextLang = lang === 'en' ? 'ar' : 'en';
        setLang(nextLang);
        try {
          localStorage.setItem('abeer_portfolio_lang', nextLang);
        } catch(e) {}
      };

      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
        document.title = t.meta.title;
        if (isRTL) {
          document.body.classList.add('font-arabic');
          document.body.classList.remove('font-sans');
        } else {
          document.body.classList.add('font-sans');
          document.body.classList.remove('font-arabic');
        }
      }, [lang, isRTL, t.meta.title]);

      return (
        <LangContext.Provider value={{ lang, toggleLang, isRTL, t }}>
          <div dir={isRTL ? 'rtl' : 'ltr'} className="min-h-screen bg-white text-zinc-900 selection:bg-[#FCE4D6]">
            <Navbar />
            <main>
              <Hero />
              <Experience />
              <Projects />
              <Skills />
              <Education />
              <Contact />
            </main>
            <Footer />
          </div>
        </LangContext.Provider>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
